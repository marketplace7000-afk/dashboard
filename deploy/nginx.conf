# Auto Vibe — reverse proxy.
# Положить в /etc/nginx/sites-available/autovibe и слинковать в sites-enabled.
# Замени server_name на свой домен (или _ для доступа только по IP).
# SSL-блок добавит certbot автоматически (см. DEPLOY_SERVER.md).

server {
    listen 80;
    listen [::]:80;
    server_name _;   # ← замени на autovibe.example.ru когда привяжешь домен

    # Заголовки безопасности (прожарка 20.10.2026): только HTTPS, сайт не встраивается
    # в чужие страницы, браузер не угадывает тип файла, адрес не утекает на чужие сайты.
    # HSTS имеет смысл после certbot (на голом http браузер его игнорирует).
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Прокси к WB/Ozon могут отдавать большие отчёты (reportDetailByPeriod)
    client_max_body_size 10m;
    proxy_read_timeout 320s;   # api/route maxDuration = 300s
    proxy_send_timeout 320s;

    # Всё (статика фронта + /api,/wb,/ozon,/ozon-perf) обслуживает Node на :8080.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
