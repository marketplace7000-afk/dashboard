# Auto Vibe — reverse proxy.
# Положить в /etc/nginx/sites-available/autovibe и слинковать в sites-enabled.
# Замени server_name на свой домен (или _ для доступа только по IP).
# SSL-блок добавит certbot автоматически (см. DEPLOY_SERVER.md).

server {
    listen 80;
    listen [::]:80;
    server_name _;   # ← замени на autovibe.example.ru когда привяжешь домен

    # Прокси к WB/Ozon могут отдавать большие отчёты (reportDetailByPeriod)
    client_max_body_size 10m;
    proxy_read_timeout 320s;   # api/route maxDuration = 300s
    proxy_send_timeout 320s;

    # Всё (статика фронта + /api,/wb,/ozon,/ozon-perf) обслуживает Node на :8080.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
